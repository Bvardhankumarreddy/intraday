brokerage:
  rate_pct: "0.03"
  cap_per_order: "20"
  rounding: paisa
  effective_from: 2020-01-01
  source:
    name: Illustrative assumption (no broker selected)
    url: "n/a"
    retrieved_on: 2026-10-19

gst:
  rate_pct: "18"
  effective_from: 2020-01-01
  source:
    name: Illustrative - 18% GST as applied by Indian brokers
    url: https://groww.in/pricing
    retrieved_on: 2026-10-19

charges:
